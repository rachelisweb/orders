<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>רחליס — אין חיבור</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    background: #f1f5f9; color: #0f172a;
    font-family: "Assistant", "Segoe UI", Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 360px;
    background: #fff; border: 1px solid #dde5ee; border-radius: 16px;
    padding: 32px 24px; text-align: center;
  }
  img { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 16px; }
  h1 { font-size: 1.25rem; font-weight: 800; margin-bottom: 8px; }
  p { color: #52627a; font-size: .95rem; line-height: 1.5; margin-bottom: 24px; }
  button {
    font: inherit; font-weight: 700; font-size: 1rem;
    min-height: 44px; padding: 0 24px;
    border: 0; border-radius: 10px;
    background: #2563eb; color: #fff; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
</style>
</head>
<body>
  <main class="card">
    <img src="icons/icon-192.png" alt="">
    <h1>אין חיבור לאינטרנט</h1>
    <p>האפליקציה צריכה חיבור כדי להציג הזמנות ומלאי. כשהחיבור יחזור, העמוד ייטען מחדש לבד.</p>
    <button type="button" onclick="location.reload()">לנסות שוב</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
